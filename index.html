<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F4B740" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon.svg" />
<title>우리집 저금통</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  @property --lvl{ syntax:'<percentage>'; inherits:false; initial-value:0%; }
  :root{
    --paper:#F3F1E9; --card:#FFFFFF; --ink:#283A3F; --muted:#6E7E80;
    --line:#E7E3D6; --gold:#F4B740; --go:#2DB67D; --go-soft:#E4F4EC;
    --warn:#E2574C; --shadow:0 10px 30px rgba(40,58,63,.08); --r:20px;
  }
  *{box-sizing:border-box}
  html,body{margin:0; height:100%}
  body{font-family:"Noto Sans KR",system-ui,sans-serif; background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased}
  .jua{font-family:"Jua",sans-serif; letter-spacing:.2px}

  .app{min-height:100dvh; max-width:900px; margin:0 auto; display:flex; flex-direction:column; padding:16px 16px calc(14px + env(safe-area-inset-bottom))}
  .head{text-align:center}
  .goalName{font-size:26px; margin:0}
  .cheer{font-size:14px; color:var(--muted); margin-top:4px; min-height:1.1em}

  /* 그림(이미지)만 흑백→컬러, 박스를 그림 비율에 맞춰 정확히 차오름 */
  .stage{flex:1; display:flex; align-items:center; justify-content:center; min-height:200px; padding:6px 0; transition:max-height .34s cubic-bezier(.22,1,.36,1)}
  .art{position:relative; width:min(92vw,64vh); max-height:68vh; transition:width .34s cubic-bezier(.22,1,.36,1)}
  .art .layer{position:absolute; inset:0; width:100%; height:100%; object-fit:contain}
  .art .gray{filter:grayscale(1) contrast(1.18) brightness(1.03)}
  .art .color{ --lvl:0%; opacity:1; transition:--lvl .6s cubic-bezier(.22,1,.36,1), opacity .45s ease;
    -webkit-mask-image:linear-gradient(to top,#000 0%,#000 calc(var(--lvl) - 5%),rgba(0,0,0,0) calc(var(--lvl) + 6%),rgba(0,0,0,0) 100%);
            mask-image:linear-gradient(to top,#000 0%,#000 calc(var(--lvl) - 5%),rgba(0,0,0,0) calc(var(--lvl) + 6%),rgba(0,0,0,0) 100%); }
  .art .surface{position:absolute; left:9%; right:9%; bottom:0; height:3px; border-radius:3px;
    background:rgba(255,255,255,.65); box-shadow:0 0 12px 2px rgba(255,255,255,.4);
    transition:bottom .6s cubic-bezier(.22,1,.36,1); opacity:0; pointer-events:none}
  @keyframes bob{0%,100%{transform:translateY(1.5px)}50%{transform:translateY(-2px)}}
  @media(prefers-reduced-motion:no-preference){ .art .surface{animation:bob 3s ease-in-out infinite} }

  .dash{margin:8px 6px 14px}
  .dash-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px}
  .d-col{display:flex; flex-direction:column; gap:2px} .d-col.right{align-items:flex-end}
  .d-lbl{font-size:12px; color:var(--muted)}
  .d-val{font-size:18px} .d-val.saved{color:#1c8a5b}
  .d-pct{font-size:34px; line-height:1}
  .meter{position:relative; height:10px; background:#E8E4D7; border-radius:999px; overflow:hidden}
  .meter i{display:block; height:100%; border-radius:999px; transition:width .6s cubic-bezier(.22,1,.36,1)}
  .meter .tick{position:absolute; top:0; bottom:0; width:2px; margin-left:-1px; background:rgba(40,58,63,.26)}

  .btns{display:flex; gap:12px}
  .btn{flex:1; border:none; cursor:pointer; font-family:inherit; font-weight:700; font-size:19px; padding:20px; border-radius:var(--r); transition:transform .12s; box-shadow:var(--shadow)}
  .btn:active{transform:scale(.98)}
  .btn.save{background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center; gap:10px}
  .btn.set{background:var(--card); color:var(--ink)}
  .btn.next{background:var(--gold); color:var(--ink); width:100%; margin-bottom:10px; animation:risein .42s ease}
  @keyframes risein{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}

  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:14px 22px; border-radius:14px; font-size:16px; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:90; max-width:90vw; text-align:center}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)} .toast.warn{background:var(--warn)}

  .scrim{position:fixed; inset:0; background:rgba(40,58,63,.5); display:flex; align-items:center; justify-content:center; padding:18px; z-index:80; opacity:0; visibility:hidden; pointer-events:none; transition:opacity .28s ease, visibility .28s ease}
  .scrim.show{opacity:1; visibility:visible; pointer-events:auto}
  .modal{background:var(--card); border-radius:var(--r); padding:22px; width:100%; max-width:480px; max-height:90vh; overflow:auto; box-shadow:var(--shadow); transform:translateY(14px) scale(.98); transition:transform .32s cubic-bezier(.22,1,.36,1)}
  .scrim.show .modal{transform:none}
  @media (prefers-reduced-motion:reduce){ .scrim,.modal{transition:none} }
  .modal h2{font-size:22px; margin:0 0 4px} .modal p.sub{margin:0 0 14px; color:var(--muted); font-size:14px}
  .modal label{display:block; font-size:14px; color:var(--muted); margin:14px 0 6px}
  .modal input[type=text],.modal input[type=number]{width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:12px; font-size:16px; font-family:inherit; background:#FBFAF4}
  .pills{display:flex; gap:8px; flex-wrap:wrap}
  .pill{border:2px solid var(--line); background:#FBFAF4; color:var(--ink); font-family:inherit; font-weight:700; padding:10px 16px; border-radius:999px; cursor:pointer}
  .pill.on{border-color:var(--go); background:var(--go-soft); color:#1c6b48}
  .gitem{display:flex; align-items:center; gap:10px; padding:12px; border:2px solid var(--line); border-radius:14px; margin-top:8px; cursor:pointer; background:#FBFAF4}
  .gitem.on{border-color:var(--go); background:var(--go-soft)}
  .gitem .em{font-size:26px; width:30px; text-align:center}
  .gitem img.em{width:30px; height:30px; object-fit:contain; font-size:0}
  .gitem .nm{font-weight:700} .gitem .pr{font-size:13px; color:var(--muted)}
  .gitem .now{margin-left:auto; font-size:12px; color:#1c6b48; font-weight:700}
  .gitem .del{margin-left:auto; background:none; border:none; color:var(--warn); cursor:pointer; font-size:14px}
  .shelf{display:flex; gap:10px; flex-wrap:wrap; margin-top:8px}
  .done{width:96px; padding:10px 8px; border:2px solid var(--line); border-radius:14px; background:#FBFAF4; text-align:center; cursor:pointer; position:relative}
  .done.on{border-color:var(--go); background:var(--go-soft)}
  .done img{width:62px; height:62px; object-fit:contain; display:block; margin:0 auto 4px}
  .done .dn{display:block; font-size:12px; font-weight:700; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .done .ck{display:block; font-size:11px; color:#1c8a5b; font-weight:700; margin-top:2px}
  .photoRow{display:flex; align-items:center; gap:12px; margin-top:8px}
  .photoBtn{flex:1; padding:14px; border:1.5px dashed var(--line); border-radius:12px; background:#FBFAF4; color:var(--ink); font-family:inherit; font-weight:700; font-size:15px; cursor:pointer}
  .photoPrev{width:58px; height:58px; border-radius:12px; object-fit:contain; border:1px solid var(--line); background:#fff}
  .hint{font-size:12px; color:var(--muted); margin:8px 0 0; line-height:1.45}
  .orline{font-size:12px; color:var(--muted); text-align:center; margin:14px 0 6px}
  .emojiPick{display:flex; gap:8px; flex-wrap:wrap}
  .emojiPick button{font-size:24px; width:46px; height:46px; border-radius:12px; border:2px solid var(--line); background:#FBFAF4; cursor:pointer}
  .emojiPick button.sel{border-color:var(--go); background:var(--go-soft)}
  .colorPick{display:flex; gap:8px; flex-wrap:wrap}
  .colorPick button{width:34px; height:34px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1px var(--line); cursor:pointer; padding:0}
  .colorPick button.sel{box-shadow:0 0 0 3px var(--go)}
  .iconPick{display:flex; gap:8px; flex-wrap:wrap}
  .iconPick button{width:56px; height:56px; border-radius:12px; border:2px solid var(--line); background:#FBFAF4; cursor:pointer; padding:6px; display:flex; align-items:center; justify-content:center}
  .iconPick button.sel{border-color:var(--go); background:var(--go-soft)}
  .iconPick img{max-width:100%; max-height:100%; object-fit:contain}
  .iconTabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px}
  .iconTabs button{border:none; background:var(--paper); color:var(--muted); font-family:inherit; font-weight:700; font-size:13px; padding:7px 13px; border-radius:999px; cursor:pointer}
  .iconTabs button.on{background:var(--ink); color:#fff}
  .formPrev{display:flex; justify-content:center; margin:10px 0 2px}
  .formPrev img{height:118px; max-width:78%; object-fit:contain}
  body.sheet .stage{max-height:34vh; align-items:flex-start; padding-top:2px}
  #scrim{align-items:flex-end}
  #scrim .modal{width:100%; max-width:640px; max-height:66vh; border-radius:22px 22px 0 0; transform:translateY(100%)}
  #scrim.show .modal{transform:translateY(0)}
  .previewTag{display:none}
  body.sheet .previewTag{display:block; text-align:center; color:var(--muted); font-weight:700; font-size:13px; margin-top:8px}
  body.sheet .art{outline:3px dashed var(--prevcol, #F4B740); outline-offset:10px; border-radius:14px}
  @keyframes pop{0%{transform:scale(1)}38%{transform:scale(1.09)}68%{transform:scale(.975)}100%{transform:scale(1)}}
  @keyframes popbig{0%{transform:scale(1)}35%{transform:scale(1.16)}65%{transform:scale(.95)}100%{transform:scale(1)}}
  .art.pop{animation:pop .62s cubic-bezier(.22,1,.36,1)}
  .art.pop.big{animation:popbig .7s cubic-bezier(.22,1,.36,1)}
  .burst{position:absolute; inset:0; pointer-events:none; z-index:3}
  .burst span{position:absolute; left:50%; top:46%; font-size:24px; animation:spark .9s ease-out forwards}
  @keyframes spark{0%{opacity:0; transform:translate(-50%,-50%) scale(.4)}20%{opacity:1}100%{opacity:0; transform:translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.1)}}
  @media (prefers-reduced-motion:reduce){ .art.pop{animation:none} .burst{display:none} .stage,.art{transition:none} }
  .mActions{display:flex; gap:10px; margin-top:18px}
  .mbtn{flex:1; padding:14px; border-radius:12px; border:none; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit}
  .mbtn.primary{background:var(--go); color:#fff} .mbtn.ghost{background:var(--paper); color:var(--ink)}
  .camModal video{width:100%; border-radius:14px; background:#000; aspect-ratio:4/3; object-fit:cover}
  .camHint{font-size:13px; color:var(--muted); margin:10px 0 0; text-align:center}
  .pop{position:fixed; width:12px; height:12px; z-index:95; pointer-events:none; border-radius:3px}
  @media(prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <h1 class="goalName jua" id="goalName">—</h1>
    <div class="cheer" id="cheer"></div>
  </div>
  <div class="stage">
    <div class="art" id="art">
      <img class="layer gray"  id="artGray"  alt="" />
      <img class="layer color" id="artColor" alt="" />
      <div class="surface" id="surface"></div>
    </div>
    <div class="previewTag" id="previewTag">✨ 이렇게 보여요</div>
  </div>
  <div class="dash">
    <div class="dash-row">
      <div class="d-col"><div class="d-lbl">모은 돈</div><div class="d-val saved jua" id="dSaved">0원</div></div>
      <div class="d-pct jua" id="dPct">0%</div>
      <div class="d-col right"><div class="d-lbl">목표</div><div class="d-val jua" id="dTarget">0원</div></div>
    </div>
    <div class="meter"><i id="meter"></i><span class="tick" style="left:25%"></span><span class="tick" style="left:50%"></span><span class="tick" style="left:75%"></span></div>
  </div>
  <button class="btn next" id="nextGoalBtn" hidden>🎯 다음 목표 정하기</button>
  <div class="btns">
    <button class="btn set" id="openSettings">목표 설정</button>
    <button class="btn save" id="saveBtn"><span>📷</span> 저축하기</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="scrim" id="camScrim">
  <div class="modal camModal" role="dialog" aria-modal="true" aria-label="지폐 촬영">
    <h2 class="jua">지폐를 비춰 주세요</h2>
    <p class="sub">일련번호가 잘 보이게 화면 안에 또렷이 담아 주세요.</p>
    <video id="cam" playsinline autoplay muted></video>
    <p class="camHint" id="camHint">초점이 맞으면 ‘이 지폐 저축하기’를 눌러요.</p>
    <div class="mActions">
      <button class="mbtn primary" id="shoot">이 지폐 저축하기</button>
      <button class="mbtn ghost" id="camClose">닫기</button>
    </div>
  </div>
</div>

<div class="scrim" id="scrim">
  <div class="modal" role="dialog" aria-modal="true" aria-label="목표 설정">
    <h2 class="jua">목표 설정</h2>
    <p class="sub">누구의 저금통인지 고르고, 지금 모을 목표를 정해 주세요.</p>
    <label>아이</label>
    <div class="pills" id="kidPills"></div>
    <label>목표 (탭하면 ‘지금 모으는 목표’가 돼요)</label>
    <div id="goalList"></div>
    <div class="orline" style="margin-top:10px">지금 목표 색 바꾸기</div>
    <div class="colorPick" id="goalColor"></div>
    <div class="orline" id="doneTitle" hidden style="margin-top:14px">🏆 내가 이룬 목표</div>
    <div id="doneList" class="shelf"></div>
    <label>새 목표 만들기</label>
    <input id="gName" type="text" placeholder="목표 이름 (예: 레고 세트)" />
    <input id="gPrice" type="number" min="0" step="1000" inputmode="numeric" placeholder="가격 (원)" style="margin-top:10px" />
    <div class="photoRow">
      <button class="photoBtn" id="photoBtn" type="button">📷 사진 찍기 / 올리기</button>
      <img class="photoPrev" id="photoPrev" alt="미리보기" hidden />
    </div>
    <input type="file" id="photoInput" accept="image/*" capture="environment" hidden />
    <p class="hint">장난감만 크게, 단순한 배경에서 찍어 주세요. 사진을 올리면 배경을 지우고 흑백 그림으로 바뀌어, 저축할수록 컬러로 차올라요.</p>
    <div class="orline" style="margin-top:14px">그림 색</div>
    <div class="colorPick" id="newColor"></div>
    <div class="formPrev" id="formPrev"><img id="formPrevImg" alt="미리보기" /></div>
    <div class="orline">사진이 없으면 그림을 골라요</div>
    <div class="iconTabs" id="iconTabs"></div>
    <div class="iconPick" id="iconPick"></div>
    <div class="orline">또는 이모지</div>
    <div class="emojiPick" id="emojiPick"></div>
    <div class="mActions"><button class="mbtn primary" id="addGoal">목표 추가하기</button></div>
    <div class="mActions"><button class="mbtn ghost" id="closeSettings">닫기</button></div>
  </div>
</div>

<script type="module">
/* ═══ 설정 — 비우면 데모, 채우면 진짜(카메라·인식·저장·스토리지) ═══ */
const CONFIG = { SUPABASE_URL:"", SUPABASE_ANON_KEY:"", RECOGNIZE_ENDPOINT:"" };
const LIVE = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
let sb = null;

const day=86400000, now=Date.now();

/* 예시용 벡터 일러스트 — 직접 그려 어떤 크기에서도 선명, 색도 바꿀 수 있음 */
const PAL=['#E0564B','#E08A2B','#F4B740','#2DB67D','#3F86C9','#9B6FD4','#D24B86'];
function darken(hex,f){ const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.round(r*(1-f)); g=Math.round(g*(1-f)); b=Math.round(b*(1-f)); return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }
const IDLE_CSS='<style>.idle{transform-box:fill-box;transform-origin:center;animation:breathe 3.6s ease-in-out infinite}.ey{transform-box:fill-box;transform-origin:center;animation:blink 4.2s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}@media(prefers-reduced-motion:reduce){.idle,.ey{animation:none}}</style>';
function wrap(vb,inner){ const p=vb.split(' ');
  return { src:"data:image/svg+xml,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}">${IDLE_CSS}<g class="idle">${inner}</g></svg>`), aspect:Number(p[2])/Number(p[3]) }; }
const ART={
  bike(color){
    const r=96, R={x:113,y:267}, F={x:447,y:267};
    const spokes=(c)=>{ let s=''; for(let i=0;i<8;i++){ const a=i*Math.PI/4;
      s+=`<line x1="${c.x}" y1="${c.y}" x2="${(c.x+Math.cos(a)*(r-12)).toFixed(1)}" y2="${(c.y+Math.sin(a)*(r-12)).toFixed(1)}"/>`; } return s; };
    const wheel=(c)=>`<circle cx="${c.x}" cy="${c.y}" r="${r}" fill="none" stroke="#2A2B30" stroke-width="18"/>`
      +`<circle cx="${c.x}" cy="${c.y}" r="${r-14}" fill="#FBF7F0" stroke="#C6C8CE" stroke-width="4"/>`
      +`<g stroke="#AEB2BB" stroke-width="2.2">${spokes(c)}</g><circle cx="${c.x}" cy="${c.y}" r="9" fill="#8C9097"/>`;
    const inner=wheel(R)+wheel(F)
      +`<path d="M280,267 L116,267" fill="none" stroke="#71747C" stroke-width="4" opacity="0.8" transform="translate(0,7)"/>`
      +`<g fill="none" stroke="${color}" stroke-linecap="round" stroke-linejoin="round">`
      +`<path d="M220,40 L372,70" stroke-width="13"/><path d="M280,267 L372,70" stroke-width="13"/>`
      +`<path d="M280,267 L220,40" stroke-width="13"/><path d="M220,40 L113,267" stroke-width="9"/>`
      +`<path d="M280,267 L113,267" stroke-width="9"/><path d="M372,70 L447,267" stroke-width="11"/></g>`
      +`<g fill="none" stroke="#3A3B40" stroke-linecap="round" stroke-width="9"><path d="M372,70 L388,20"/><path d="M352,16 L416,30"/></g>`
      +`<g stroke="#1F2024" stroke-linecap="round" stroke-width="13"><path d="M348,15 L360,18"/><path d="M408,28 L420,31"/></g>`
      +`<path d="M196,30 q24,-15 50,-2 q-7,13 -27,13 q-18,0 -23,-11 z" fill="#2B2B2E"/>`
      +`<circle cx="280" cy="267" r="19" fill="none" stroke="#9A9DA6" stroke-width="6"/><circle cx="280" cy="267" r="6" fill="#7E818A"/>`
      +`<path d="M280,267 L300,302" fill="none" stroke="#3A3B40" stroke-linecap="round" stroke-width="7"/><rect x="292" y="300" width="23" height="9" rx="3" fill="#1F2024"/>`;
    return wrap("0 0 560 380", inner);
  },
  game(color){
    const d=darken(color,.18);
    const inner=`<rect x="20" y="20" width="130" height="320" rx="55" fill="${color}"/>`
      +`<rect x="370" y="20" width="130" height="320" rx="55" fill="${color}"/>`
      +`<rect x="150" y="20" width="220" height="320" rx="20" fill="#20232A"/>`
      +`<rect x="168" y="42" width="184" height="276" rx="10" fill="#2E3440"/>`
      +`<circle cx="85" cy="118" r="26" fill="${d}"/><circle cx="85" cy="118" r="15" fill="#3A3D44"/>`
      +`<g fill="${d}"><rect x="70" y="232" width="30" height="12" rx="4"/><rect x="79" y="223" width="12" height="30" rx="4"/></g>`
      +`<circle cx="435" cy="242" r="26" fill="${d}"/><circle cx="435" cy="242" r="15" fill="#3A3D44"/>`
      +`<g fill="${d}"><circle cx="435" cy="100" r="11"/><circle cx="435" cy="140" r="11"/><circle cx="415" cy="120" r="11"/><circle cx="455" cy="120" r="11"/></g>`;
    return wrap("0 0 520 360", inner);
  },
  dino(color){

function iconFromName(name){ const n=(name||'').toLowerCase(); let best=null, score=-1;

function wonKo(n){

  const man=Math.floor(n/10000), rest=n%10000; let s=man+"만";

  return s+" 원";                                   /* 예: 35만 원, 32만 9천 원 */
}

/* 가벼운 배경 제거: 네 모서리 색을 배경으로 보고 비슷한 영역을 투명 처리(플러드필) */
function removeBackground(c, tol=44){
  const x=c.getContext('2d'), w=c.width, h=c.height, img=x.getImageData(0,0,w,h), d=img.data;
  const cs=[[0,0],[w-1,0],[0,h-1],[w-1,h-1]]; let br=0,bg=0,bb=0;
  cs.forEach(([cx,cy])=>{ const i=(cy*w+cx)*4; br+=d[i]; bg+=d[i+1]; bb+=d[i+2]; }); br/=4; bg/=4; bb/=4;
  const seen=new Uint8Array(w*h), st=[]; cs.forEach(([cx,cy])=>st.push(cy*w+cx)); const t2=tol*tol;
  while(st.length){ const p=st.pop(); if(seen[p]) continue; seen[p]=1; const i=p*4;
    const dr=d[i]-br,dg=d[i+1]-bg,dbl=d[i+2]-bb; if(dr*dr+dg*dg+dbl*dbl>t2) continue;
    d[i+3]=0; const px=p%w, py=(p/w)|0;
    if(px>0)st.push(p-1); if(px<w-1)st.push(p+1); if(py>0)st.push(p-w); if(py<h-1)st.push(p+w); }
  x.putImageData(img,0,0); return c;
}
/* 투명 여백 잘라내기 → 박스가 그림에 딱 맞아 정확히 차오름 */
function trimCanvas(c){
  const x=c.getContext('2d'), w=c.width, h=c.height, d=x.getImageData(0,0,w,h).data;
  let top=h,left=w,right=0,bottom=0,hit=false;
  for(let y=0;y<h;y++) for(let xx=0;xx<w;xx++){ if(d[(y*w+xx)*4+3]>14){ hit=true;
    if(y<top)top=y; if(y>bottom)bottom=y; if(xx<left)left=xx; if(xx>right)right=xx; } }
  if(!hit) return {canvas:c, aspect:c.width/c.height};
  const pad=Math.round(Math.max(right-left,bottom-top)*0.05);
  left=Math.max(0,left-pad); top=Math.max(0,top-pad); right=Math.min(w-1,right+pad); bottom=Math.min(h-1,bottom+pad);
  const cw=right-left+1, ch=bottom-top+1, o=document.createElement('canvas'); o.width=cw; o.height=ch;
  o.getContext('2d').drawImage(c,left,top,cw,ch,0,0,cw,ch); return {canvas:o, aspect:cw/ch};
}
function emojiArt(emoji){

  x.font="400 "+Math.floor(SZ*0.78)+"px 'Apple Color Emoji','Noto Color Emoji','Segoe UI Emoji',sans-serif";
  x.fillText(emoji,SZ/2,SZ/2); const {canvas,aspect}=trimCanvas(c); return {src:canvasURL(canvas),aspect};
}

}

async function commit(amount, serial){
  const g=active(), before=savedFor(g.id);
  if(serial && await db.isDuplicate(S.childId,serial,amount)){ toast("이미 저축한 지폐예요! 같은 돈은 한 번만 셀 수 있어요.", true); return; }
  const rec={ child_id:S.childId, goal_id:g.id, amount, type:'bill', serial:serial||null };
  S.deposits.unshift({ id:'tmp'+Date.now(), t:Date.now(), ...rec }); render();
  const res=await db.insertDeposit(rec);
  if(!res.ok){ S.deposits=S.deposits.filter(d=>!String(d.id).startsWith('tmp')); render();
    toast(res.dup?"이미 저축한 지폐예요!":"저장에 실패했어요. 다시 시도해 주세요.", true); return; }
  const bPct=Math.min(100,Math.round((before/g.price)*100)), aPct=Math.min(100,Math.round(((before+amount)/g.price)*100));
  if(before<g.price && before+amount>=g.price){ party(); celebrate(true); toast(g.name+" 다 모았어요! 🎉", false); }
  else { let ms=0; for(const th of [25,50,75]) if(bPct<th && aPct>=th) ms=th;
    if(ms && ms>msSeen(g)){ await setMsSeen(g,ms); celebrate(false); toast(({25:"좋아요! 벌써 25%나 모았어요 👏",50:"절반이나 모았어요! 🙌",75:"거의 다 왔어요! 75% 돌파 🔥"})[ms], false); }
    else toast("+"+won(amount)+"원 저축했어요!", false); }
}

/* 카메라 + Cloud Vision (없으면 예시) */
let stream=null;
async function onSave(){ if(!CONFIG.RECOGNIZE_ENDPOINT) return simulate();
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); $("#cam").srcObject=stream; $("#camScrim").classList.add("show"); }
  catch(e){ toast("카메라를 열 수 없어 예시 모드로 진행해요.", true); simulate(); } }
function closeCam(){ $("#camScrim").classList.remove("show"); if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }
async function shoot(){
  const v=$("#cam"); if(!v.videoWidth){ toast("잠시 후 다시 눌러 주세요.", true); return; }
  const cv=document.createElement('canvas'); cv.width=v.videoWidth; cv.height=v.videoHeight; cv.getContext('2d').drawImage(v,0,0);
  const b64=cv.toDataURL('image/jpeg',0.85).split(',')[1]; $("#camHint").textContent="지폐를 읽는 중…";
  try{ const r=await fetch(CONFIG.RECOGNIZE_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:b64})});
    const out=await r.json(); $("#camHint").textContent="초점이 맞으면 ‘이 지폐 저축하기’를 눌러요.";
    if(!out.serial||!out.amount){ toast("일련번호가 안 보여요. 더 또렷하게 다시 찍어 주세요.", true); return; }
    closeCam(); await commit(out.amount, out.serial);
  }catch(e){ $("#camHint").textContent="초점이 맞으면 ‘이 지폐 저축하기’를 눌러요."; toast("인식 서버에 연결하지 못했어요.", true); }
}
function simulate(){ const btn=$("#saveBtn"); btn.disabled=true; const html=btn.innerHTML; btn.innerHTML="<span>🔎</span> 읽는 중…";
  setTimeout(async()=>{ btn.disabled=false; btn.innerHTML=html; const d=[1000,5000,5000,10000]; await commit(d[Math.floor(Math.random()*d.length)], genSerial()); },800); }
function genSerial(){ const L="ABCDEFGHJKLMNPRSTUVWXYZ",r=a=>a[Math.floor(Math.random()*a.length)]; let n=""; for(let i=0;i<8;i++)n+=Math.floor(Math.random()*10); return r(L)+r(L)+n+r(L); }

/* 알림·축하 */
let toastT;
function toast(m,w){ const e=$("#toast"); e.textContent=m; e.className="toast show"+(w?" warn":""); clearTimeout(toastT); toastT=setTimeout(()=>e.className="toast"+(w?" warn":""),2200); }
function party(){ if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const cols=["#F4B740","#2DB67D","#E0564B","#3F86C9","#D24B86"];
  for(let i=0;i<44;i++){ const p=document.createElement("div"); p.className="pop"; p.style.background=cols[i%cols.length];
    p.style.left=(45+Math.random()*10)+"vw"; p.style.top="40vh"; document.body.appendChild(p);
    const dx=(Math.random()-.5)*600, dy=200+Math.random()*280, rot=Math.random()*720;
    p.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${rot}deg)`,opacity:0}],{duration:1500+Math.random()*600,easing:"cubic-bezier(.2,.6,.3,1)"}).onfinish=()=>p.remove(); } }

/* 설정 모달 */
let pickEmoji=null, pendingPhoto=null, newColorSel=PAL[0], pickIcon=null;
function openSettings(){ document.body.classList.add('sheet'); drawKids(); drawGoals(); drawIconTabs(); drawIconPick(); drawEmoji(); drawColor('newColor',newColorSel); drawColor('goalColor',(active()&&active().color)||PAL[0]); updatePreview(); $("#scrim").classList.add("show"); }
function drawColor(id,sel){ document.getElementById(id).innerHTML=PAL.map(c=>`<button data-color="${c}" class="${c===sel?'sel':''}" style="background:${c}"></button>`).join(""); }
const CATS=[['탈것','🛴',['bike','kickboard','drone']],['동물','🦖',['dino','teddy']],['장난감','🎮',['game','robot','guitar','ball']],['선물','🎁',['gift']]];
let catSel=0;
function drawIconTabs(){ $("#iconTabs").innerHTML=CATS.map((c,i)=>`<button data-cat="${i}" class="${i===catSel?'on':''}">${c[1]} ${c[0]}</button>`).join(""); }
function drawIconPick(){ $("#iconPick").innerHTML=CATS[catSel][2].map(k=>`<button data-icon="${k}" class="${pickIcon===k?'sel':''}"><img src="${ART[k](newColorSel).src}" alt="${k}"></button>`).join(""); }
function previewSrc(){ if(pendingPhoto) return {src:pendingPhoto.preview, aspect:pendingPhoto.aspect};
  if(pickIcon) return ART[pickIcon](newColorSel);
  if(pickEmoji) return emojiArt(pickEmoji);
  const ic=iconFromName($("#gName").value.trim()); return ART[ic||'gift'](newColorSel); }
function artW(asp){ return document.body.classList.contains('sheet') ? `min(64vw, calc(30vh * ${asp}))` : `min(92vw, calc(64vh * ${asp}))`; }
function setMainArt(a){ const base=$("#artGray"), col=$("#artColor"), wrap=$("#art");
  if(base.dataset.src!==a.src){ base.src=a.src; col.src=a.src; base.dataset.src=col.dataset.src=a.src; }
  wrap.style.aspectRatio=String(a.aspect); wrap.style.width=artW(a.aspect);
  col.style.opacity='1'; col.style.setProperty('--lvl','112%'); $("#surface").style.opacity='0'; }
function updatePreview(){ const a=previewSrc(); $("#formPrevImg").src=a.src; $("#art").style.setProperty('--prevcol', newColorSel); if(document.body.classList.contains('sheet')) setMainArt(a); }
const closeSettings=()=>{ document.body.classList.remove('sheet'); $("#scrim").classList.remove("show"); render(); };
function celebrate(big){ const art=$("#art"); if(!art) return;
  art.classList.remove('pop','big'); void art.offsetWidth; art.classList.add('pop'); if(big) art.classList.add('big');
  const marks = big ? ['✨','⭐','🎉','🌟','✨','⭐','🎉','🌟','✨','⭐'] : ['✨','⭐','🎉','✨','⭐','✨'];
  const burst=document.createElement('div'); burst.className='burst';
  marks.forEach((ch,i)=>{ const s=document.createElement('span'); s.textContent=ch;
    const ang=i/marks.length*Math.PI*2, d=(big?100:72)+Math.random()*(big?60:28);
    s.style.setProperty('--tx',(Math.cos(ang)*d).toFixed(0)+'px'); s.style.setProperty('--ty',(Math.sin(ang)*d).toFixed(0)+'px');
    if(big) s.style.fontSize='30px';
    s.style.animationDelay=(i*30)+'ms'; burst.appendChild(s); });
  art.appendChild(burst); setTimeout(()=>burst.remove(), big?1500:1100); }
function drawKids(){ $("#kidPills").innerHTML=children.map(c=>`<button class="pill ${c.id===S.childId?'on':''}" data-kid="${c.id}">${c.name}</button>`).join(""); }
function drawGoals(){
  const act=S.goals.filter(g=>savedFor(g.id)<g.price), done=S.goals.filter(g=>savedFor(g.id)>=g.price);
  $("#goalList").innerHTML=act.map(g=>{
    const ns=savedFor(g.id), pct=Math.min(100,Math.round((ns/g.price)*100)), on=g.id===S.activeId;
    return `<div class="gitem ${on?'on':''}" data-go="${g.id}"><img class="em" src="${artFor(g).src}" alt="">
      <span><span class="nm">${g.name}</span><br><span class="pr">${won(ns)} / ${won(g.price)}원 · ${pct}%</span></span>
      ${on?'<span class="now">지금 모으는 중</span>':(S.goals.length>1?`<button class="del" data-del="${g.id}">삭제</button>`:'')}</div>`;
  }).join("") || '<div class="pr" style="color:var(--muted)">진행 중인 목표가 없어요. 아래에서 새 목표를 만들어요.</div>';
  $("#doneTitle").hidden = done.length===0;
  $("#doneList").innerHTML = done.map(g=>`<div class="done ${g.id===S.activeId?'on':''}" data-go="${g.id}"><img src="${artFor(g).src}" alt=""><span class="dn">${g.name}</span><span class="ck">완료 ✅</span></div>`).join("");
}
function drawEmoji(){ $("#emojiPick").innerHTML=EMOJIS.map(e=>`<button data-e="${e}" class="${(!pendingPhoto&&e===pickEmoji)?'sel':''}">${e}</button>`).join(""); }
function clearPhoto(){ pendingPhoto=null; $("#photoPrev").hidden=true; $("#photoPrev").src=""; $("#photoBtn").textContent="📷 사진 찍기 / 올리기"; }

/* 이벤트 */
$("#saveBtn").onclick=onSave; $("#shoot").onclick=shoot; $("#camClose").onclick=closeCam;
$("#nextGoalBtn").onclick=openSettings;
$("#camScrim").addEventListener("click",e=>{ if(e.target===$("#camScrim")) closeCam(); });
$("#openSettings").onclick=openSettings; $("#closeSettings").onclick=closeSettings;
$("#scrim").addEventListener("click",e=>{ if(e.target===$("#scrim")) closeSettings(); });
$("#kidPills").addEventListener("click",e=>{ const b=e.target.closest("[data-kid]"); if(b) loadChild(b.dataset.kid).then(openSettings); });
$("#goalList").addEventListener("click",async e=>{
  const del=e.target.closest("[data-del]");
  if(del){ e.stopPropagation(); await db.delGoal(del.dataset.del); await loadChild(S.childId); openSettings(); return; }
  const it=e.target.closest("[data-go]");
  if(it){ S.activeId=it.dataset.go; await db.setActive(S.childId,S.activeId); render(); drawGoals(); }
});
$("#doneList").addEventListener("click",async e=>{ const it=e.target.closest("[data-go]");
  if(it){ S.activeId=it.dataset.go; await db.setActive(S.childId,S.activeId); render(); drawGoals(); }
});
$("#photoBtn").onclick=()=>$("#photoInput").click();
$("#photoInput").addEventListener("change", async e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  $("#photoBtn").textContent="배경 지우는 중…";
  try{ pendingPhoto=await processImage(f); const pv=$("#photoPrev"); pv.src=pendingPhoto.preview; pv.hidden=false; $("#photoBtn").textContent="📷 사진 바꾸기"; drawEmoji(); updatePreview(); }
  catch(err){ $("#photoBtn").textContent="📷 사진 찍기 / 올리기"; toast("사진을 불러오지 못했어요.", true); }
  e.target.value="";
});
$("#iconTabs").addEventListener("click",e=>{ const b=e.target.closest("[data-cat]"); if(b){ catSel=+b.dataset.cat; drawIconTabs(); drawIconPick(); }});
$("#iconPick").addEventListener("click",e=>{ const b=e.target.closest("[data-icon]"); if(b){ pickIcon=b.dataset.icon; pickEmoji=null; clearPhoto(); drawIconPick(); drawEmoji(); updatePreview(); }});
$("#emojiPick").addEventListener("click",e=>{ const b=e.target.closest("[data-e]"); if(b){ pickEmoji=b.dataset.e; pickIcon=null; clearPhoto(); drawEmoji(); drawIconPick(); updatePreview(); }});
$("#newColor").addEventListener("click",e=>{ const b=e.target.closest("[data-color]"); if(b){ newColorSel=b.dataset.color; drawColor('newColor',newColorSel); drawIconPick(); updatePreview(); }});
$("#gName").addEventListener("input",updatePreview);
$("#goalColor").addEventListener("click",async e=>{ const b=e.target.closest("[data-color]"); if(!b) return; const g=active(); if(!g) return; g.color=b.dataset.color; await db.setColor(g.id,g.color); render(); drawColor('goalColor',g.color); });
$("#addGoal").onclick=async()=>{
  const name=$("#gName").value.trim(), price=Number($("#gPrice").value)||0;
  if(!name||price<=0){ toast("이름과 가격을 정해 주세요.", true); return; }
  let image=null, aspect=1;
  if(pendingPhoto){ toast("사진 올리는 중…", false); image=await db.upload(pendingPhoto.canvas); aspect=pendingPhoto.aspect; }
  const g={ name, color:newColorSel, price, sort:S.goals.length, image, aspect, icon:pendingPhoto?null:(pickIcon||null), emoji:(pendingPhoto||pickIcon)?null:pickEmoji };
  await db.addGoal(S.childId, g);
  $("#gName").value=""; $("#gPrice").value=""; clearPhoto(); pickIcon=null; pickEmoji=null;
  await loadChild(S.childId);
  const mine=S.goals.filter(x=>x.name===name); if(mine.length){ S.activeId=mine[mine.length-1].id; await db.setActive(S.childId,S.activeId); render(); }
  closeSettings(); setTimeout(celebrate,320); toast("새 목표 '"+name+"'을(를) 추가했어요.", false);
};

/* 시작 + 서비스워커 */
async function init(){
  if(LIVE){ const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2'); sb=createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY); }
  children=await db.children();
  if(children.length) await loadChild(children[0].id);
  if('serviceWorker' in navigator){ try{ await navigator.serviceWorker.register('./sw.js'); }catch(e){} }
}
init();
</script>
